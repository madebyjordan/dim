name: Eclipse

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "eclipse/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "api-contract/**"
      - "scripts/generate-api-contract.mjs"
      - ".nvmrc"
  pull_request:
    paths:
      - "eclipse/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "api-contract/**"
      - "scripts/generate-api-contract.mjs"
      - ".nvmrc"
    branches:
      - master

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Prettier
        run: corepack pnpm --dir eclipse exec prettier --check src
      - name: API contract drift
        run: corepack pnpm --dir eclipse contract:check
      - name: TypeScript
        run: corepack pnpm --dir eclipse check
      - name: Tests
        run: corepack pnpm --dir eclipse test
      - name: Build webui
        run: corepack pnpm --dir eclipse build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webui
          path: eclipse/build/
