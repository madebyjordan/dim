name: React

on:
  workflow_dispatch:
  push:
    paths:
    - "ui/**"
    - "api-contract/**"
    - "scripts/generate-api-contract.mjs"
    - ".nvmrc"
  pull_request:
    paths:
    - "ui/**"
    - "api-contract/**"
    - "scripts/generate-api-contract.mjs"
    - ".nvmrc"
    branches:
    - master

defaults:
  run:
    working-directory: ui

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: yarn
          cache-dependency-path: ui/yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install locked dependencies
        env:
          YARN_ENABLE_HARDENED_MODE: "1"
        run: yarn install --immutable --mode=skip-build
      - name: Prettier
        run: yarn run prettier --check --ignore-unknown src
      - name: API contract drift
        run: yarn contract:check
      - name: TypeScript
        run: yarn typecheck
      - name: ESLint
        run: yarn lint
      - name: Tests
        run: yarn test
      - name: Build webui
        run: yarn build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: webui
          path: ui/build/
