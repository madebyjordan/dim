name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update
      - run: sudo apt-get install -y libva-dev libva-drm2 libva2 sqlite3 curl xz-utils
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Provision verified FFmpeg 9 tools
        run: |
          bash scripts/install-ffmpeg9-linux.sh utils amd64
          echo "$GITHUB_WORKSPACE/utils" >> "$GITHUB_PATH"

      - name: Verify source installation
        run: ./scripts/bootstrap.sh --release

      - name: Create release dir
        run: |
          mkdir -p release/utils
          cp utils/ffmpeg release/utils/ffmpeg
          cp utils/ffprobe release/utils/ffprobe
          chmod +x release/utils/ffmpeg
          chmod +x release/utils/ffprobe

      - name: Create Cargo target directory
        run: mkdir -p target

      - name: Test Eclipse
        run: cargo test --workspace --tests --locked

      - name: Copy Eclipse binary
        run: |
          cp target/release/eclipse release/eclipse
          chmod +x release/eclipse

      - name: Compress release dir
        run: tar -zcvf eclipse-release.tar.gz release

      - name: Save artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-release
          path: eclipse-release.tar.gz
