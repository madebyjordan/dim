name: Windows

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/windows.yml"
      - "install.sh"
      - "scripts/**"
      - "eclipse/**"
      - "dim*/**"
      - "vendor/nightfall/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/windows.yml"
      - "install.sh"
      - "scripts/**"
      - "eclipse/**"
      - "dim*/**"
      - "vendor/nightfall/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  native-installer:
    name: Native Git Bash installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Enable Corepack
        run: corepack enable
      - name: Install Windows media and SQLite tools
        shell: pwsh
        run: choco install ffmpeg sqlite -y --no-progress
      - name: Test installer and Windows script boundaries
        run: corepack pnpm test:installer
      - name: Run the native Windows installer
        run: ./install.sh --platform windows --yes --no-start
      - name: Start Eclipse and verify readiness
        run: |
          set -euo pipefail
          ./scripts/run.sh --release > eclipse-windows.log 2>&1 &
          eclipse_pid=$!
          trap 'kill "$eclipse_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$eclipse_pid" 2>/dev/null; then
              cat eclipse-windows.log >&2
              exit 1
            fi
            sleep 1
          done
          cat eclipse-windows.log >&2
          exit 1
      - name: Verify a repeat setup preserves local state
        run: |
          set -euo pipefail
          test -f target/release/config/config.toml
          test -f target/release/config/dim.db
          config_before=$(sha256sum target/release/config/config.toml)
          database_before=$(sha256sum target/release/config/dim.db)
          ffmpeg_before=$(sha256sum target/release/utils/ffmpeg.exe)
          ffprobe_before=$(sha256sum target/release/utils/ffprobe.exe)
          ./install.sh --platform windows --yes --no-start
          [[ "$(sha256sum target/release/config/config.toml)" == "$config_before" ]]
          [[ "$(sha256sum target/release/config/dim.db)" == "$database_before" ]]
          [[ "$(sha256sum target/release/utils/ffmpeg.exe)" == "$ffmpeg_before" ]]
          [[ "$(sha256sum target/release/utils/ffprobe.exe)" == "$ffprobe_before" ]]
      - name: Verify wrong-platform diagnostics
        run: |
          set -euo pipefail
          if ./install.sh --platform linux --yes --no-start > wrong-platform.log 2>&1; then
            echo "A Windows host unexpectedly accepted the Linux installer path." >&2
            exit 1
          fi
          grep -F "The Linux installer must be run on Linux" wrong-platform.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-windows-log
          path: eclipse-windows.log
          if-no-files-found: ignore
