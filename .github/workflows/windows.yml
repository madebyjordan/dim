name: Windows

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/windows.yml"
      - "install.cmd"
      - "install.sh"
      - "scripts/**"
      - "api-contract/**"
      - "eclipse/**"
      - "dim*/**"
      - "vendor/nightfall/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/windows.yml"
      - "install.cmd"
      - "install.sh"
      - "scripts/**"
      - "api-contract/**"
      - "eclipse/**"
      - "dim*/**"
      - "vendor/nightfall/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".nvmrc"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  native-installer:
    name: Native Git Bash installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install Windows media and SQLite tools
        shell: pwsh
        run: choco install ffmpeg sqlite -y --no-progress
      - name: Mask any globally installed pnpm command
        shell: pwsh
        run: |
          $mask = Join-Path $env:RUNNER_TEMP "eclipse-no-global-pnpm"
          New-Item -ItemType Directory -Force $mask | Out-Null
          "@echo off`r`necho Direct pnpm invocation is disabled in Windows installer CI. 1>&2`r`nexit /b 86" |
            Set-Content -Encoding Ascii (Join-Path $mask "pnpm.cmd")
          $mask | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify Corepack is the only usable pnpm entrypoint
        shell: pwsh
        run: |
          pnpm --version
          if ($LASTEXITCODE -ne 86) {
            throw "The direct pnpm sentinel was not used."
          }
          $version = corepack pnpm --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne "11.9.0") {
            throw "Corepack did not resolve repository-pinned pnpm 11.9.0."
          }
      - name: Test installer lifecycle, clean Corepack, native scripts, and toolchain detection
        run: node --test ./scripts/install.test.mjs ./scripts/package-manager.test.mjs ./scripts/prepare-pnpm.test.mjs ./scripts/rust-dependencies.test.mjs ./scripts/windows-launcher.test.mjs ./scripts/windows-scripts.test.mjs ./scripts/windows-toolchain.test.mjs
      - name: Exercise native launcher from CMD
        shell: cmd
        run: install.cmd --demo --platform windows --yes --no-start
      - name: Exercise native launcher from PowerShell
        shell: pwsh
        run: .\install.cmd --demo --demo-scenario reinstall --platform windows --yes --no-start
      - name: Exercise destructive and exit demo branches without mutation
        run: |
          ./install.sh --demo --demo-scenario reset --platform windows --yes --no-start
          ./install.sh --demo --demo-scenario clean --platform windows --yes --no-start
          ./install.sh --demo --demo-scenario exit --platform windows --yes --no-start
      - name: Run the native Windows installer
        shell: pwsh
        run: .\install.cmd --platform windows --yes --no-start
      - name: Verify persistent pnpm from fresh Windows shells
        shell: pwsh
        run: |
          $shim = Join-Path $env:LOCALAPPDATA "Eclipse\bin"
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          if (-not (($userPath -split ";") -contains $shim)) {
            throw "The installer did not persist the user-level Corepack shim directory."
          }
          $gitBash = (Get-Command bash.exe -ErrorAction Stop).Source
          $env:Path = [Environment]::ExpandEnvironmentVariables("$machinePath;$userPath")

          $cmdVersion = (cmd.exe /d /c "pnpm --version").Trim()
          if ($LASTEXITCODE -ne 0 -or $cmdVersion -ne "11.9.0") {
            throw "Fresh CMD resolved unexpected pnpm version '$cmdVersion'."
          }
          $powershellVersion = (powershell.exe -NoProfile -NonInteractive -Command "pnpm --version").Trim()
          if ($LASTEXITCODE -ne 0 -or $powershellVersion -ne "11.9.0") {
            throw "Fresh PowerShell resolved unexpected pnpm version '$powershellVersion'."
          }
          $bashVersion = (& $gitBash -lc 'cd "$(cygpath -u "$GITHUB_WORKSPACE")" && pnpm --version').Trim()
          if ($LASTEXITCODE -ne 0 -or $bashVersion -ne "11.9.0") {
            throw "Fresh Git Bash resolved unexpected pnpm version '$bashVersion'."
          }
          $shim | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify pinned Windows Rust release build
        run: |
          rustc --version --verbose
          cargo build --release --locked
          test -f target/release/eclipse.exe
          test ! -f target/release/dim.exe
      - name: Test Windows-style Prettier resolution
        run: node --test ./scripts/generate-api-contract.test.mjs
      - name: Exercise API contract check and production frontend build
        run: |
          node ./scripts/generate-api-contract.mjs --check
          corepack pnpm --dir eclipse build
          corepack pnpm --dir eclipse test -- src/routes/login/page.test.ts
      - name: Start Eclipse, verify readiness, reinstall, and clean while it is running
        run: |
          set -euo pipefail
          ./scripts/run.sh --release > eclipse-windows.log 2>&1 &
          eclipse_pid=$!
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$eclipse_pid" 2>/dev/null; then
              cat eclipse-windows.log >&2
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            cat eclipse-windows.log >&2
            exit 1
          fi
          test -f target/release/config/config.toml
          test -f target/release/config/dim.db
          config_before=$(sha256sum target/release/config/config.toml)
          database_before=$(sha256sum target/release/config/dim.db)
          ffmpeg_before=$(sha256sum target/release/utils/ffmpeg.exe)
          ffprobe_before=$(sha256sum target/release/utils/ffprobe.exe)
          ./install.sh --platform windows --yes --no-start
          if kill -0 "$eclipse_pid" 2>/dev/null; then
            echo "The installer did not stop the locked Eclipse executable before rebuilding." >&2
            exit 1
          fi
          test -f target/release/eclipse.exe
          test ! -f target/release/dim.exe
          [[ "$(sha256sum target/release/config/config.toml)" == "$config_before" ]]
          [[ "$(sha256sum target/release/config/dim.db)" == "$database_before" ]]
          [[ "$(sha256sum target/release/utils/ffmpeg.exe)" == "$ffmpeg_before" ]]
          [[ "$(sha256sum target/release/utils/ffprobe.exe)" == "$ffprobe_before" ]]

          cp target/release/eclipse.exe target/release/dim.exe
          pushd target/release
          ./dim.exe >> ../../eclipse-windows.log 2>&1 &
          clean_pid=$!
          popd
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$clean_pid" 2>/dev/null; then
              cat eclipse-windows.log >&2
              exit 1
            fi
            sleep 1
          done
          [[ "$ready" == true ]]
          rm -f target/release/dim.exe
          test ! -e target/release/dim.exe
          ./install.sh --platform windows --yes --existing-action clean --no-start
          if kill -0 "$clean_pid" 2>/dev/null; then
            echo "Clean install deleted state before the verified Eclipse process exited." >&2
            exit 1
          fi
          test ! -e target/release/config/config.toml
          test ! -e target/release/config/dim.db
          test ! -e target/release/config/dim.db-journal
          test ! -e target/release/config/dim.db-wal
          test ! -e target/release/config/dim.db-shm
          test ! -e target/release/metadata
          test ! -e target/release/streaming_cache

          ./scripts/run.sh --release >> eclipse-windows.log 2>&1 &
          first_run_pid=$!
          ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/health/ready >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$first_run_pid" 2>/dev/null; then
              cat eclipse-windows.log >&2
              exit 1
            fi
            sleep 1
          done
          [[ "$ready" == true ]]
          admin_state=$(curl --fail --silent http://localhost:8000/api/v1/auth/admin_exists)
          [[ "$admin_state" == '{"exists":false}' ]]
          printf '%s\n' shutdown > target/release/eclipse.shutdown
          for attempt in {1..80}; do
            kill -0 "$first_run_pid" 2>/dev/null || break
            sleep 0.25
          done
          if kill -0 "$first_run_pid" 2>/dev/null; then
            echo "Eclipse did not honor its runtime-local shutdown request." >&2
            exit 1
          fi
      - name: Start development through the normal pnpm command
        shell: pwsh
        run: |
          $pnpm = (Get-Command pnpm -ErrorAction Stop).Source
          $stdout = Join-Path $env:RUNNER_TEMP "pnpm-dev.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "pnpm-dev.stderr.log"
          $process = Start-Process -FilePath $pnpm -ArgumentList "dev", "--release" -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $stdout -RedirectStandardError $stderr -WindowStyle Hidden -PassThru
          $ready = $false
          for ($attempt = 0; $attempt -lt 60; $attempt++) {
            try {
              Invoke-WebRequest -UseBasicParsing http://localhost:8000/health/ready | Out-Null
              $ready = $true
              break
            } catch {
              if ($process.HasExited) {
                Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
                throw "pnpm dev exited before Eclipse became ready."
              }
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ready) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "pnpm dev did not make Eclipse ready."
          }
          "shutdown" | Set-Content -Encoding Ascii target/release/eclipse.shutdown
          if (-not $process.WaitForExit(20000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "pnpm dev did not exit after Eclipse shutdown."
          }
          $combined = (Get-Content $stdout, $stderr -Raw -ErrorAction SilentlyContinue) -join "`n"
          if ($combined -match "pnpm.*not recognized|pnpm: command not found") {
            throw "pnpm dev encountered a command-resolution failure."
          }
      - name: Verify wrong-platform diagnostics
        run: |
          set -euo pipefail
          if ./install.sh --platform linux --yes --no-start > wrong-platform.log 2>&1; then
            echo "A Windows host unexpectedly accepted the Linux installer path." >&2
            exit 1
          fi
          grep -F "The Linux installer must be run on Linux" wrong-platform.log
      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-windows-log
          path: |
            eclipse-windows.log
            ${{ runner.temp }}/pnpm-dev.*.log
          if-no-files-found: ignore
