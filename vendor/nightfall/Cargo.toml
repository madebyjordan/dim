[package]
name = "nightfall"
version = "0.3.12-rc4"
authors = ["Valerian G. <valerian.garleanu@pm.me>"]
edition = "2021"
license = "GPL-2.0"
description = "Nightfall is a library allowing on-demand video transcoding and streaming."
repository = "https://github.com/vgarleanu/nightfall"
documentation = "https://docs.rs/nightfall"

# Keep new warnings from accumulating across every advertised adapter feature set.
[lints.rust]
warnings = { level = "deny", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
items_after_test_module = "allow"
never_loop = "allow"
result_large_err = "allow"

[features]
vaapi = ["dep:rusty_vainfo"]
cuda = []
ssa_transmux = []

default = ["cuda", "vaapi"]

[dependencies]
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
mp4 = { git = "https://github.com/vgarleanu/mp4-rust", rev = "27f62343cdf4fc7fe94c455135d6210c77e17f9a" }

tracing = "0.1"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "io-std",
    "macros",
    "sync",
    "time",
    "rt",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
rusty_vainfo = { version = "0.1.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
